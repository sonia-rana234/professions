<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кого заменит робот?</title>
<style>
/* ============================================================
   ПРОЕКТ
   Тема: «Кого заменит робот?»
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
    background: #f0f4ff;
    background-image:
        radial-gradient(circle at 15% 20%, #ffe4ec 0%, transparent 35%),
        radial-gradient(circle at 85% 75%, #d6ecff 0%, transparent 35%),
        radial-gradient(circle at 50% 50%, #fff8dd 0%, transparent 45%);
    min-height: 100vh;
    padding: 18px 14px 60px;
    color: #2d2d4a;
}

.wrap {
    max-width: 820px;
    margin: 0 auto;
}

/* ============ ТИТУЛЬНЫЙ БЛОК ============ */
.title-page {
    background: #ffffff;
    border: 3px double #b8c5ff;
    border-radius: 18px;
    padding: 26px 22px;
    margin-bottom: 22px;
    box-shadow: 0 4px 14px rgba(120, 100, 200, 0.12);
    text-align: center;
}
.title-page h1 {
    font-size: 24px;
    color: #6c5ce7;
    margin: 10px 0 8px;
    line-height: 1.3;
}
.title-page .year {
    font-size: 13px;
    color: #8888aa;
    margin-top: 14px;
    font-style: italic;
}

/* ============ ЗАГОЛОВКИ РАЗДЕЛОВ ============ */
.section-title {
    font-size: 18px;
    text-align: center;
    margin: 18px 0 6px;
    color: #6c5ce7;
    font-weight: bold;
}
.section-title::before,
.section-title::after {
    content: ' ✦ ';
    color: #b8c5ff;
}

.sub {
    text-align: center;
    color: #8888aa;
    font-size: 13px;
    margin-bottom: 14px;
    line-height: 1.6;
}

.divider {
    height: 3px;
    background: repeating-linear-gradient(
        90deg,
        #b8c5ff 0px, #b8c5ff 10px,
        transparent 10px, transparent 20px
    );
    margin: 30px 0;
    border-radius: 3px;
}

/* ============ АЛФАВИТ ============ */
.alphabet {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 8px;
    margin-bottom: 16px;
}
.alphabet button {
    background: #ffffff;
    border: 2px solid #b8c5ff;
    color: #6c5ce7;
    padding: 12px 4px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 2px 0 #b8c5ff;
}
.alphabet button:hover { background: #eef2ff; transform: translateY(-2px); }
.alphabet button.active {
    background: #6c5ce7;
    color: #ffffff;
    border-color: #6c5ce7;
    box-shadow: 0 2px 0 #4a3fbf;
}

/* ============ КАРТОЧКИ ПРОФЕССИЙ ============ */
.items-box {
    display: none;
    background: #ffffff;
    border-radius: 16px;
    padding: 16px 14px;
    box-shadow: 0 4px 12px rgba(120, 100, 200, 0.12);
    border: 2px solid #e5e9ff;
}
.items-box.open { display: block; }

.items-title {
    font-size: 14px;
    text-align: center;
    color: #8888aa;
    margin-bottom: 12px;
    font-style: italic;
}

.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f8f9ff;
    border: 1.5px solid #e5e9ff;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
    gap: 10px;
}
.item:hover { background: #eef2ff; border-color: #b8c5ff; }
.item .name { font-size: 15px; flex: 1; color: #2d2d4a; }

.badge {
    padding: 4px 11px;
    border-radius: 14px;
    font-size: 11px;
    font-weight: bold;
    white-space: nowrap;
}
.badge.danger  { background: #ffe0e0; color: #d63031; border: 1px solid #ffb8b8; }
.badge.safe    { background: #e0ffe4; color: #00a844; border: 1px solid #a8e6b8; }
.badge.partial { background: #fff4d6; color: #cc8800; border: 1px solid #ffe0a0; }

.pct-badge {
    font-size: 12px;
    color: #6c5ce7;
    font-weight: bold;
    background: #eef2ff;
    padding: 4px 10px;
    border-radius: 10px;
    white-space: nowrap;
}
.pct-badge.my { background: #e0ffe4; color: #00a844; }

/* ============ ПОЛНЫЙ ЭКРАН ============ */
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #f0f4ff;
    background-image:
        radial-gradient(circle at 30% 20%, #ffe4ec 0%, transparent 40%),
        radial-gradient(circle at 70% 80%, #d6ecff 0%, transparent 40%);
    z-index: 100;
    padding: 30px 20px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}
.overlay.show { display: flex; }

.overlay .prof-name {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 18px;
    color: #2d2d4a;
}
.overlay .verdict {
    font-size: 30px;
    font-weight: bold;
    padding: 18px 38px;
    border-radius: 50px;
    margin-bottom: 22px;
    border: 3px solid;
}
.overlay .verdict.danger  { background: #ffe0e0; color: #d63031; border-color: #ffb8b8; }
.overlay .verdict.safe    { background: #e0ffe4; color: #00a844; border-color: #a8e6b8; }
.overlay .verdict.partial { background: #fff4d6; color: #cc8800; border-color: #ffe0a0; }
.overlay .desc {
    color: #555577;
    font-size: 15px;
    max-width: 460px;
    line-height: 1.6;
    margin-bottom: 26px;
}
.overlay .close-btn {
    background: #6c5ce7;
    color: #ffffff;
    border: none;
    padding: 14px 40px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 4px 0 #4a3fbf;
    transition: all 0.1s;
}
.overlay .close-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #4a3fbf; }

/* ============ ИНФО-СООБЩЕНИЕ ============ */
.stat-box {
    margin-top: 14px;
    padding: 14px 16px;
    background: #ffffff;
    border: 2px dashed #b8c5ff;
    border-radius: 14px;
    color: #6c5ce7;
    font-size: 14px;
    text-align: center;
    line-height: 1.5;
}
.stat-box.voted {
    background: #e0ffe4;
    border-color: #a8e6b8;
    color: #00a844;
    font-weight: bold;
}

/* ============ ПОДВАЛ ============ */
.footer {
    text-align: center;
    color: #aaaacc;
    font-size: 12px;
    margin-top: 30px;
    font-style: italic;
    line-height: 1.9;
    padding-top: 18px;
    border-top: 2px dashed #e5e9ff;
}

@media (max-width: 500px) {
    .title-page h1 { font-size: 19px; }
    .overlay .prof-name { font-size: 21px; }
    .overlay .verdict { font-size: 22px; padding: 14px 26px; }
    .alphabet { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }
    .alphabet button { font-size: 15px; padding: 10px 3px; }
}
</style>
</head>
<body>

"Ученый":"safe","Учитель":"safe",

"Фармацевт":"partial","Фасовщик":"danger","Фельдшер":"safe","Физик":"safe",
"Финансист":"partial","Флорист":"safe","Фотограф":"safe","Фрезеровщик":"safe",

"Хранитель музея":"safe","Художник":"partial",

"Цветовод":"safe","Циркач":"safe",

"Чабан":"safe","Часовщик":"safe","Чертежник":"partial","Чистильщик":"danger",

"Шахтер":"safe","Швея":"safe","Шеф-повар":"safe","Шофер":"danger",
"Штукатур":"safe","Штурман":"safe",

"Эвакуаторщик":"safe","Эколог":"safe","Экономист":"partial","Экскурсовод":"safe",
"Электрик":"safe","Электромонтер":"safe","Эндокринолог":"safe","Этнограф":"safe",

"Ювелир":"safe","Юрист":"partial",

"Языковед":"safe","Яхтсмен":"safe"
};

const DESC = {
    danger:  'Эту работу уже выполняют алгоритмы и роботы. Профессия в зоне высокого риска.',
    safe:    'Профессия требует живого общения, творчества или работы руками — ИИ её не заменит.',
    partial: 'ИИ возьмёт на себя часть задач, но человек останется главным специалистом.'
};

// ============================================================
// СОСТОЯНИЕ
// ============================================================
let votes = {};
let totalVotes = 0;
let myVote = null;

try {
    myVote = localStorage.getItem('myVote');
} catch (e) {}

const LETTERS = [...new Set(Object.keys(DATA).map(p => p[0]))].sort();

function makeId(str) {
    return str.replace(/[^a-zA-Zа-яА-Я0-9]/g, '_');
}

// ============================================================
// СТРОЮ АЛФАВИТЫ
// ============================================================
function buildAlphabet(id, handler) {
    const box = document.getElementById(id);
    box.innerHTML = '';
    for (let i = 0; i < LETTERS.length; i++) {
        const btn = document.createElement('button');
        btn.textContent = LETTERS[i];
        btn.dataset.letter = LETTERS[i];
        btn.onclick = () => handler(LETTERS[i], btn);
        box.appendChild(btn);
    }
}

// ============================================================
// СПРАВОЧНИК
// ============================================================
buildAlphabet('topAlphabet', showTop);

function showTop(letter, btn) {
    document.querySelectorAll('#topAlphabet button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    document.getElementById('topTitle').textContent = 'Профессии на букву «' + letter + '»';

    const box = document.getElementById('topItems');
    box.innerHTML = '';

    const list = Object.keys(DATA)
        .filter(n => n.startsWith(letter))
        .sort((a, b) => a.localeCompare(b, 'ru'));

    list.forEach(name => {
        const verdict = DATA[name];
        const card = document.createElement('div');
        card.className = 'item';

        const badgeText =
            verdict === 'danger'  ? 'Заменит' :
            verdict === 'safe'    ? 'Не заменит' :
                                    'Частично';

        card.innerHTML =
            '<span class="name">' + name + '</span>' +
            '<span class="badge ' + verdict + '">' + badgeText + '</span>';

        card.onclick = () => openOverlay(name, verdict);
        box.appendChild(card);
    });

    document.getElementById('topBox').classList.add('open');
}

// ============================================================
// ОПРОС
// ============================================================
buildAlphabet('bottomAlphabet', showBottom);

function showBottom(letter, btn) {
    document.querySelectorAll('#bottomAlphabet button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    document.getElementById('bottomTitle').textContent = 'Голосование: буква «' + letter + '»';

    const box = document.getElementById('bottomItems');
    box.innerHTML = '';

    const list = Object.keys(DATA)
        .filter(n => n.startsWith(letter))
        .sort((a, b) => a.localeCompare(b, 'ru'));

    list.forEach(name => {
        const isMine = (myVote === name);
        const count = votes[name] || 0;
        const percent = totalVotes ? Math.round(count / totalVotes * 100) : 0;

        const card = document.createElement('div');
        card.className = 'item';
        if (myVote && !isMine) card.style.opacity = '0.5';

        card.innerHTML =
            '<span class="name">' + (isMine ? '✔ ' : '') + name + '</span>' +
            '<span class="pct-badge' + (isMine ? ' my' : '') + '">' + percent + '%</span>';

        card.onclick = () => tryVote(name);
        box.appendChild(card);
    });

    document.getElementById('bottomBox').classList.add('open');
}

function tryVote(name) {
    if (myVote) {
        const c = votes[myVote] || 0;
        const p = totalVotes ? Math.round(c / totalVotes * 100) : 0;
        if (myVote === name) {
            showStat('✔ Ты уже проголосовала за «' + name + '». За неё: ' + p + '% (' + c + ' из ' + totalVotes + ')', true);
        } else {
            showStat('Ты уже проголосовала за «' + myVote + '» (' + p + '%). Больше одного раза нельзя.', true);
        }
        return;
    }

    myVote = name;
    try { localStorage.setItem('myVote', name); } catch (e) {}

    votes[name] = (votes[name] || 0) + 1;
    totalVotes++;

    const c = votes[name];
    const p = Math.round(c / totalVotes * 100);

    showStat('✅ Твой голос за «' + name + '» учтён! За неё: ' + p + '% (' + c + ' из ' + totalVotes + ')', true);

    if (SCRIPT_URL) sendVote(name);

    const active = document.querySelector('#bottomAlphabet button.active');
    if (active) showBottom(name[0], active);
}

function showStat(text, voted) {
    const el = document.getElementById('statBox');
    el.textContent = text;
    el.className = 'stat-box' + (voted ? ' voted' : '');
}

function sendVote(name) {
    const cb = 'cb_' + Date.now();
    window[cb] = function (data) {
        if (data && data.stats) {
            votes = data.stats;
            totalVotes = data.total || 0;
        }
    };
    const s = document.createElement('script');
    s.src = SCRIPT_URL + '?action=vote&prof=' + encodeURIComponent(name) + '&callback=' + cb;
    document.body.appendChild(s);
}

function loadStats() {
    if (!SCRIPT_URL) return;
    const cb = 'cbs_' + Date.now();
    window[cb] = function (data) {
        if (data && data.stats) {
            votes = data.stats;
            totalVotes = data.total || 0;
        }
    };
    const s = document.createElement('script');
    s.src = SCRIPT_URL + '?action=stats&callback=' + cb;
    document.body.appendChild(s);
}
loadStats();

function openOverlay(name, verdict) {
    document.getElementById('ovName').textContent = name;

    const v = document.getElementById('ovVerdict');
    v.className = 'verdict ' + verdict;

    if (verdict === 'danger')       v.textContent = 'ЗАМЕНИТ';
    else if (verdict === 'safe')    v.textContent = 'НЕ ЗАМЕНИТ';
    else                            v.textContent = 'ЧАСТИЧНО';

    document.getElementById('ovDesc').textContent = DESC[verdict];

    document.getElementById('overlay').classList.add('show');
    document.body.style.overflow = 'hidden';
}

function closeOverlay() {
    document.getElementById('overlay').classList.remove('show');
    document.body.style.overflow = '';
}
</script>
</body>
</html>
